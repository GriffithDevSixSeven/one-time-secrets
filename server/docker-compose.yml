services:
  postgres-service:
    container_name: postgres-service
    image: postgres:18-bookworm
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DATABASE=$POSTGRES_DATABASE
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_USER=$POSTGRES_USER
    volumes:
      - $PWD/out/pg_data:/var/lib/postgresql
    restart: always
    networks:
      - one-time-secrets-net


networks:
  one-time-secrets-net:
    name: one-time-secrets-net
    driver: bridge

    